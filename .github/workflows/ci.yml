name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Build and install with the shadcn CLI (plain HTML, React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
